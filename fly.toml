# Binance blocks US IPs, so run outside the US (Singapore).
app = "tickstream"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[env]
  PORT = "8080"
  SYMBOLS = "BTCUSDT,ETHUSDT,SOLUSDT"
  BAR_INTERVAL = "10s"
  SMA_FAST = "9"
  SMA_SLOW = "21"
  DB_PATH = "/data/tickstream.db"

# SQLite lives on a persistent volume so alerts and sessions survive restarts and deploys.
[mounts]
  source = "tickstream_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The ingest loop and in-memory state must stay alive: never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
