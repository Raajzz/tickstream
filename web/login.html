<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tickstream login</title>
<style>
:root { color-scheme: light; --bg:#f4f4f2; --surface:#fcfcfb; --border:#e2e1dc; --text:#0b0b0b; --text-2:#52514e; --accent:#2a78d6; --err:#b32d2d; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg:#111110; --surface:#1a1a19; --border:#2e2e2c; --text:#f0efec; --text-2:#c3c2b7; --accent:#3987e5; --err:#e66767; }
}
:root[data-theme="dark"] { color-scheme: dark; --bg:#111110; --surface:#1a1a19; --border:#2e2e2c; --text:#f0efec; --text-2:#c3c2b7; --accent:#3987e5; --err:#e66767; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
form { width:100%; max-width:340px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; display:grid; gap:14px; }
h1 { font-size:18px; margin:0; }
p { margin:0; color:var(--text-2); }
label { display:grid; gap:4px; font-size:12px; color:var(--text-2); }
input, button { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 10px; min-height:40px; width:100%; }
button { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.err { color:var(--err); font-size:13px; }
</style>
<script>
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<form method="post" action="/login">
  <h1>Tickstream</h1>
  <p>Enter the access password to continue.</p>
  <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
  <p class="err" id="err" role="alert" hidden></p>
  <button type="submit">Sign in</button>
</form>
<script>
const e = new URLSearchParams(location.search).get("err");
const msg = { bad: "Wrong password.", rate: "Too many attempts. Try again in 15 minutes." }[e];
if (msg) { const n = document.getElementById("err"); n.textContent = msg; n.hidden = false; }
</script>
</body>
</html>
